name: Aggiorna valori di mercato

on:
  # Una volta al giorno, alle 04:00 UTC (06:00 in Italia in estate, 05:00 in inverno)
  schedule:
    - cron: '0 4 * * *'

  # Permette di lanciarlo a mano dal tab "Actions" su GitHub
  workflow_dispatch:
    inputs:
      game:
        description: 'Aggiorna solo un gioco (o tutti)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - 'Dragon Ball'
          - 'Digimon'
          - 'Pokémon'
          - 'One Piece'
      rematch:
        description: 'Ricerca di nuovo anche le carte già matchate (ignora justtcgId salvato)'
        required: false
        default: false
        type: boolean
      debug:
        description: 'Stampa nei log la risposta grezza delle prime ricerche (per debug)'
        required: false
        default: false
        type: boolean

jobs:
  update-values:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aggiorna i valori di mercato sul Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
          GAME_FILTER: ${{ github.event.inputs.game || 'all' }}
          REMATCH: ${{ github.event.inputs.rematch || 'false' }}
          DEBUG: ${{ github.event.inputs.debug || 'false' }}
        run: node scripts/update-values.mjs
